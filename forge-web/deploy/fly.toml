# Fly.io settings for the Forge web server. Deploy with forge-web/deploy/deploy.sh.
app = "f0rgetang"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # On demand while testing: the machine stops a few minutes after the last connection closes
  # and starts again (about 20 s) on the next visit. Games live in memory, so a stop drops them.
  # For always on: auto_stop_machines = "off" and min_machines_running = 1.
  # Either way, keep exactly one machine: a second would split players across servers.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/formats"

# Saved shared deck lists
[[mounts]]
  source = "forge_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
