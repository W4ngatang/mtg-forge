# Fly.io settings for the Forge web server. Deploy with forge-web/deploy/deploy.sh.
app = "APP-NAME"
primary_region = "REGION"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Games live in this machine's memory: keep exactly one running, never stopped while idle,
  # or a friend game waiting on its invite would be lost.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/formats"

# Saved shared deck lists
[[mounts]]
  source = "forge_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
