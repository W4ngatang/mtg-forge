<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge (debug client)</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --line: #ccc; --pick: #2563eb; --chosen: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #444; --pick: #60a5fa; --chosen: #4ade80; } }
  body { background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; margin: 0 16px 120px; }
  h2 { font-size: 15px; margin: 14px 0 4px; }
  .muted { color: var(--muted); }
  .card { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; margin: 2px; cursor: pointer; }
  .card.tapped { opacity: .55; }
  .card.pick { border-color: var(--pick); border-width: 2px; }
  .card.chosen { border-color: var(--chosen); border-width: 2px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 16px; }
  button { font-size: 16px; padding: 8px 14px; margin: 4px 4px 0 0; }
  #ask { border: 2px solid var(--pick); border-radius: 8px; padding: 8px; margin: 8px 0; }
  #log { max-height: 160px; overflow-y: auto; font-size: 13px; }
  input, select { font-size: 16px; margin: 4px 0; }
</style>
</head>
<body>
<p class="muted">Debug client: plain, but complete enough to play. The real phone screen comes next.</p>
<div id="start">
  <label>Format <select id="format"><option value="DANDAN">DanDan</option><option value="MOMIR">Momir Basic</option></select></label><br>
  <label>Your name <input id="name" value="Player"></label><br>
  <label>Host password <input id="password" type="password"></label><br>
  <button id="go">Start a game against the computer</button>
</div>
<div id="game" hidden>
  <div id="ask" hidden></div>
  <div id="board"></div>
  <h2>Stack</h2><div id="stack"></div>
  <h2>Log</h2><div id="log" class="muted"></div>
</div>
<div id="bar" hidden>
  <div id="prompt"></div>
  <button id="ok">OK</button><button id="cancel">Cancel</button>
  <span id="mana"></span>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let ws, state = null, selection = null, ask = null, picks = [];

function connect(query) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?${query}`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (localStorage.getItem("forgeSeat")) setTimeout(reconnect, 2000); };
}
function reconnect() {
  try {
    const s = JSON.parse(localStorage.getItem("forgeSeat"));
    if (s) connect(`game=${encodeURIComponent(s.game)}&seat=${encodeURIComponent(s.seat)}`);
  } catch (e) { /* storage unavailable */ }
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function handle(m) {
  switch (m.t) {
    case "joined":
      try { localStorage.setItem("forgeSeat", JSON.stringify({ game: m.game, seat: m.seat })); } catch (e) {}
      $("start").hidden = true; $("game").hidden = false; $("bar").hidden = false; break;
    case "state": state = m; render(); break;
    case "prompt": $("prompt").textContent = m.text; break;
    case "buttons":
      setButton($("ok"), m.ok); setButton($("cancel"), m.cancel); break;
    case "selection": selection = m; render(); break;
    case "ask": ask = m; picks = []; renderAsk(); break;
    case "notice": alert((m.title ? m.title + "\n" : "") + m.text); break;
    case "invalid": navigator.vibrate && navigator.vibrate(80); break;
    case "error": $("prompt").textContent = "Error: " + m.text; break;
    case "gameOver":
      try { localStorage.removeItem("forgeSeat"); } catch (e) {}
      $("prompt").textContent = "Game over" + (state && state.winner ? `: ${state.winner} won` : ""); break;
  }
}
function setButton(b, o) { b.textContent = o.label || "-"; b.disabled = !o.enabled; }

function cardEl(c) {
  const el = document.createElement("span");
  el.className = "card" + (c.tapped ? " tapped" : "");
  if (c.hidden) { el.textContent = "(hidden)"; return el; }
  let t = c.name;
  if (c.power !== undefined) t += ` ${c.power}/${c.toughness}`;
  if (c.sick) t += " (sick)";
  if (c.counters) t += " " + Object.entries(c.counters).map(([k, v]) => `${v} ${k}`).join(", ");
  el.textContent = t;
  el.title = `${c.type} ${c.cost}\n${c.text || ""}`;
  if (selection && selection.cards.includes(c.id)) el.classList.add("pick");
  if (selection && selection.chosen.some(x => x.kind === "card" && x.id === c.id)) el.classList.add("chosen");
  el.onclick = () => send({ t: "card", id: c.id });
  return el;
}
function zone(title, cards) {
  const d = document.createElement("div");
  const h = document.createElement("div"); h.className = "muted"; h.textContent = title; d.append(h);
  cards.forEach(c => d.append(cardEl(c)));
  return d;
}
function render() {
  if (!state) return;
  const board = $("board"); board.textContent = "";
  const players = [...state.players].sort((a, b) => (a.id === state.you) - (b.id === state.you));
  for (const p of players) {
    const h = document.createElement("h2");
    const me = p.id === state.you;
    h.textContent = `${me ? "You" : p.name}: ${p.life} life` + (p.poison ? `, ${p.poison} poison` : "") +
      ` | library ${p.libraryCount}, hand ${p.handCount}` + (p.priority ? " | priority" : "") + (state.activePlayer === p.id ? " | their turn" : "");
    if (!me) h.style.cursor = "pointer";
    h.onclick = () => send({ t: "player", id: p.id });
    board.append(h);
    if (p.command.length) board.append(zone("Command", p.command));
    board.append(zone("Battlefield", p.battlefield));
    if (p.graveyard.length) board.append(zone("Graveyard", p.graveyard));
    if (p.exile.length) board.append(zone("Exile", p.exile));
    if (me) board.append(zone("Hand", p.hand));
  }
  const you = state.players.find(p => p.id === state.you);
  const mana = $("mana"); mana.textContent = "";
  for (const [color, n] of Object.entries(you ? you.mana : {})) {
    const b = document.createElement("button"); b.textContent = `${color} ${n}`;
    b.onclick = () => send({ t: "mana", color }); mana.append(b);
  }
  const stack = $("stack"); stack.textContent = "";
  for (const s of state.stack) {
    const d = document.createElement("div"); d.className = "card"; d.textContent = s.text;
    if (selection && selection.targets.some(x => x.kind === "stack" && x.id === s.id)) d.classList.add("pick");
    d.onclick = () => send({ t: "stack", id: s.id }); stack.append(d);
  }
  $("log").textContent = "";
  state.log.forEach(l => { const d = document.createElement("div"); d.textContent = l; $("log").append(d); });
  $("log").scrollTop = 1e9;
  document.title = `Forge: turn ${state.turn}, ${state.phase}`;
}

function renderAsk() {
  const box = $("ask"); box.textContent = ""; box.hidden = false;
  const title = document.createElement("div"); title.textContent = [ask.title, ask.text, ask.top].filter(Boolean).join(" "); box.append(title);
  if (ask.reveal) box.append(zone(ask.revealText || "Revealed", ask.reveal));
  const done = answer => { send(Object.assign({ t: "answer", id: ask.id }, answer)); ask = null; box.hidden = true; };
  if (ask.kind === "reveal") {
    ask.options.forEach(o => { const d = document.createElement("div"); d.textContent = o.label; box.append(d); });
    const b = document.createElement("button"); b.textContent = "OK"; b.onclick = () => done({}); box.append(b);
    return;
  }
  if (ask.kind === "text") {
    const input = document.createElement("input"); input.value = ask.initial; box.append(input);
    const b = document.createElement("button"); b.textContent = "Done"; b.onclick = () => done({ value: input.value }); box.append(b);
    return;
  }
  if (ask.kind === "amounts") {
    const inputs = ask.options.map(o => {
      const row = document.createElement("div"); const i = document.createElement("input");
      i.type = "number"; i.value = 0; i.style.width = "5em"; row.append(i, " " + o.label); box.append(row); return i;
    });
    const b = document.createElement("button"); b.textContent = `Done (total ${ask.total})`;
    b.onclick = () => done({ amounts: inputs.map(i => parseInt(i.value, 10) || 0) }); box.append(b);
    return;
  }
  const single = ask.kind === "option" || (ask.kind === "choose" && ask.max === 1 && ask.min === 1);
  ask.options.forEach((o, i) => {
    const b = document.createElement("button"); b.textContent = o.label;
    b.onclick = () => {
      if (single) { done({ choice: [i] }); return; }
      const at = picks.indexOf(i); if (at >= 0) picks.splice(at, 1); else picks.push(i);
      renderPicks();
    };
    b.dataset.index = i; box.append(b);
  });
  if (!single) {
    const status = document.createElement("div"); status.id = "picks"; box.append(status);
    const b = document.createElement("button"); b.textContent = "Done";
    b.onclick = () => done(ask.kind === "order" ? { order: picks } : { choice: picks }); box.append(b);
    renderPicks();
  }
}
function renderPicks() {
  const s = $("picks"); if (!s) return;
  s.textContent = (ask.kind === "order" ? "Order: " : "Picked: ") + (picks.map(i => ask.options[i].label).join(", ") || "none") +
    ` (${ask.min}${ask.max !== ask.min ? "-" + ask.max : ""})`;
}

$("go").onclick = () => connect(`new=${$("format").value}&name=${encodeURIComponent($("name").value)}&password=${encodeURIComponent($("password").value)}`);
$("ok").onclick = () => send({ t: "ok" });
$("cancel").onclick = () => send({ t: "cancel" });
reconnect();
</script>
</body>
</html>
